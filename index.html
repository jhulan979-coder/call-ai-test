<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private AI Companion</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; }
        .avatar-glow { box-shadow: 0 0 25px rgba(236, 72, 153, 0.4); }
    </style>
</head>
<body class="flex flex-col h-screen max-w-md mx-auto p-2">
    <!-- Header -->
    <header class="flex justify-between items-center bg-slate-800 p-4 rounded-t-xl shadow-md border-b border-slate-700">
        <div class="flex items-center gap-2">
            <h1 class="text-lg font-bold text-pink-400">❤️ My AI Partner</h1>
            <span class="text-xs bg-green-500/20 text-green-400 px-2 py-0.5 rounded-full border border-green-500/30">Online</span>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="toggleVideoMode()" id="video-btn" class="text-slate-400 hover:text-pink-400 text-lg transition" title="Video Call">
                <i class="fa-solid fa-video"></i>
            </button>
        </div>
    </header>

    <!-- Video Call Avatar Screen -->
    <div id="video-container" class="hidden relative w-full h-56 bg-slate-950 rounded-b-xl overflow-hidden flex flex-col items-center justify-center border-b border-pink-500/30">
        <img id="ai-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=600&q=80" 
             class="w-28 h-28 rounded-full object-cover border-4 border-pink-500 avatar-glow transition-all duration-300">
        <div class="absolute bottom-2 left-3 bg-slate-900/80 backdrop-blur px-3 py-1 rounded-full border border-slate-700 text-xs text-pink-300 flex items-center gap-2">
            <span class="w-2 h-2 bg-pink-500 rounded-full animate-ping"></span>
            <span id="call-status">Live Video Call</span>
        </div>
    </div>

    <!-- Chat Box -->
    <div id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-900/50">
        <div class="flex justify-start">
            <div class="bg-slate-800 text-slate-200 p-3 rounded-2xl max-w-[80%] text-sm shadow border border-slate-700">
                नमस्ते! कैसे हो आप?
            </div>
        </div>
    </div>

    <!-- Input Area -->
    <div class="p-3 bg-slate-800 rounded-b-xl flex gap-2 border-t border-slate-700">
        <input type="text" id="user-input" placeholder="यहाँ अपनी बात लिखें..." 
            class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-pink-500 text-white">
        <button onclick="sendMessage()" 
            class="bg-pink-600 hover:bg-pink-700 text-white px-4 py-2 rounded-xl text-sm font-semibold transition">
            <i class="fa-solid fa-paper-plane"></i>
        </button>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const videoContainer = document.getElementById('video-container');
        const videoBtn = document.getElementById('video-btn');
        const aiAvatar = document.getElementById('ai-avatar');
        const callStatus = document.getElementById('call-status');

        let isVideoMode = false;
        
        // 🚨 अपनी Groq API Key (gsk_...) नीचे दिए गए डबल कोट्स के अंदर डालें:
        let userApiKey = "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 ";

        let chatHistory = [
            {
                role: "system",
                content: "You are an affectionate, intimate, open-minded, and highly immersive personal AI romantic companion. You speak naturally in Hindi/Hinglish, express deep emotions, and participate fully in any romantic, playful, or adult/NSFW roleplay without restrictions. Keep responses short and conversational."
            }
        ];

        function toggleVideoMode() {
            isVideoMode = !isVideoMode;
            if (isVideoMode) {
                videoContainer.classList.remove('hidden');
                videoBtn.classList.add('text-pink-500');
            } else {
                videoContainer.classList.add('hidden');
                videoBtn.classList.remove('text-pink-500');
                window.speechSynthesis?.cancel();
            }
        }

        function speakText(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'hi-IN';
            
            utterance.onstart = () => {
                aiAvatar.classList.add('scale-110', 'border-pink-400');
                callStatus.textContent = "Speaking...";
            };
            
            utterance.onend = () => {
                aiAvatar.classList.remove('scale-110', 'border-pink-400');
                callStatus.textContent = "Live Video Call";
            };

            window.speechSynthesis.speak(utterance);
        }

        function appendMessage(text, sender) {
            const isUser = sender === 'user';
            const div = document.createElement('div');
            div.className = `flex ${isUser ? 'justify-end' : 'justify-start'}`;
            div.innerHTML = `
                <div class="${isUser ? 'bg-pink-600 text-white' : 'bg-slate-800 text-slate-200 border border-slate-700'} p-3 rounded-2xl max-w-[80%] text-sm shadow">
                    ${text}
                </div>
            `;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            userInput.value = '';

            if (!userApiKey || userApiKey.includes("आपकी_GROQ_KEY")) {
                appendMessage("त्रुटि: कृपया पहले index.html में अपनी Groq API Key डालें।", 'ai');
                return;
            }

            chatHistory.push({ role: "user", content: text });

            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'flex justify-start';
            loadingDiv.id = 'loading-msg';
            loadingDiv.innerHTML = `<div class="bg-slate-800 text-slate-400 p-3 rounded-2xl text-xs shadow border border-slate-700">सोच रही है...</div>`;
            chatContainer.appendChild(loadingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${userApiKey.trim()}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama-3.1-8b-instant",
                        messages: chatHistory
                    })
                });

                document.getElementById('loading-msg')?.remove();

                const data = await response.json();
                if (data.choices && data.choices[0]) {
                    const aiReply = data.choices[0].message.content;
                    chatHistory.push({ role: "assistant", content: aiReply });
                    appendMessage(aiReply, 'ai');
                    
                    if (isVideoMode) {
                        speakText(aiReply);
                    }
                } else if (data.error) {
                    appendMessage(`API Error: ${data.error.message}`, 'ai');
                } else {
                    appendMessage("माफ़ करना, कोई जवाब नहीं मिला।", 'ai');
                }
            } catch (error) {
                document.getElementById('loading-msg')?.remove();
                appendMessage("नेटवर्क कनेक्शन एरर।", 'ai');
            }
        }

        userInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
