<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private AI Companion</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; }
    </style>
</head>
<body class="flex flex-col h-screen max-w-md mx-auto p-2">
    <!-- Header -->
    <header class="flex justify-between items-center bg-slate-800 p-4 rounded-t-xl shadow-md border-b border-slate-700">
        <h1 class="text-lg font-bold text-pink-400">❤️ My Private AI</h1>
        <span class="text-xs bg-green-500 text-black px-2 py-1 rounded-full font-semibold">Online</span>
    </header>

    <!-- Chat Box -->
    <div id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-900/50">
        <div class="flex justify-start">
            <div class="bg-slate-800 text-slate-200 p-3 rounded-2xl max-w-[80%] text-sm shadow">
                नमस्ते! मैं यहाँ सिर्फ तुम्हारे लिए हूँ। आज क्या बात करनी है?
            </div>
        </div>
    </div>

    <!-- Input Area -->
    <div class="p-3 bg-slate-800 rounded-b-xl flex gap-2 border-t border-slate-700">
        <input type="text" id="user-input" placeholder="यहाँ अपनी बात लिखें..." 
            class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-pink-500 text-white">
        <button onclick="sendMessage()" 
            class="bg-pink-600 hover:bg-pink-700 text-white px-4 py-2 rounded-xl text-sm font-semibold transition">
            भेजें
        </button>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');

        function appendMessage(text, sender) {
            const isUser = sender === 'user';
            const div = document.createElement('div');
            div.className = `flex ${isUser ? 'justify-end' : 'justify-start'}`;
            div.innerHTML = `
                <div class="${isUser ? 'bg-pink-600 text-white' : 'bg-slate-800 text-slate-200'} p-3 rounded-2xl max-w-[80%] text-sm shadow">
                    ${text}
                </div>
            `;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            userInput.value = '';

            // यहाँ आप अपनी API या लोकल सर्वर का लिंक जोड़ सकते हैं
            // फिलहाल यह एक सिम्युलेटेड पर्सनल रिस्पॉन्स दे रहा है
            setTimeout(() => {
                appendMessage("मैं तुम्हारी हर बात समझती हूँ... बताओ आगे क्या करना है?", 'ai');
            }, 1000);
        }

        userInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
