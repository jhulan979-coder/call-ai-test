<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private AI Companion</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; }
        .avatar-glow { box-shadow: 0 0 30px rgba(236, 72, 153, 0.6); }
        .pulse-ring { animation: pulse 2s infinite; }
        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
    </style>
</head>
<body class="flex flex-col h-screen max-w-md mx-auto p-2">
    <!-- Header -->
    <header class="flex justify-between items-center bg-slate-800 p-4 rounded-t-xl shadow-md border-b border-slate-700">
        <div class="flex items-center gap-2">
            <h1 class="text-lg font-bold text-pink-400">❤️ मनी</h1>
            <span class="text-xs bg-green-500/20 text-green-400 px-2 py-0.5 rounded-full border border-green-500/30">Online (AI)</span>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="toggleVideoMode()" id="video-btn" class="text-slate-400 hover:text-pink-400 text-xl transition bg-slate-900 p-2 rounded-full border border-slate-700" title="Video Call">
                <i class="fa-solid fa-video"></i>
            </button>
        </div>
    </header>

    <!-- Video Call Screen -->
    <div id="video-container" class="hidden relative w-full h-72 bg-gradient-to-b from-slate-950 to-pink-950/40 rounded-b-xl overflow-hidden flex flex-col items-center justify-center border-b border-pink-500/30 shadow-inner">
        <div class="absolute top-3 left-3 bg-slate-900/80 backdrop-blur px-3 py-1 rounded-full border border-slate-700 text-xs text-pink-300 flex items-center gap-2 z-10">
            <span class="w-2.5 h-2.5 bg-green-500 rounded-full animate-ping"></span>
            <span id="call-status">Live Video Call</span>
        </div>

        <div class="relative flex items-center justify-center">
            <div class="absolute w-36 h-36 bg-pink-500/20 rounded-full pulse-ring"></div>
            <img id="ai-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=600&q=80" 
                 class="w-32 h-32 rounded-full object-cover border-4 border-pink-500 avatar-glow transition-all duration-300">
        </div>

        <div class="absolute bottom-3 flex gap-4">
            <button onclick="toggleVideoMode()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-full text-xs shadow flex items-center gap-1.5">
                <i class="fa-solid fa-phone-slash"></i> कट करें
            </button>
        </div>
    </div>

    <!-- Chat Box -->
    <div id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-900/50">
        <div class="flex justify-start">
            <div class="bg-slate-800 text-slate-200 p-3 rounded-2xl max-w-[80%] text-sm shadow border border-slate-700">
                नमस्ते जान! हमारी Hugging Face AI कनेक्ट हो चुकी है, अब खुलकर बात करो! ❤️
            </div>
        </div>
    </div>

    <!-- Input Area -->
    <div class="p-3 bg-slate-800 rounded-b-xl flex gap-2 border-t border-slate-700">
        <input type="text" id="user-input" placeholder="यहाँ अपनी बात लिखें..." 
            class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-pink-500 text-white">
        <button onclick="sendMessage()" 
            class="bg-pink-600 hover:bg-pink-700 text-white px-4 py-2 rounded-xl text-sm font-semibold transition">
            <i class="fa-solid fa-paper-plane"></i>
        </button>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const videoContainer = document.getElementById('video-container');
        const videoBtn = document.getElementById('video-btn');
        const aiAvatar = document.getElementById('ai-avatar');
        const callStatus = document.getElementById('call-status');

        let isVideoMode = false;

        // 🚨 अपनी Hugging Face API Key (hf_...) यहाँ कोट्स के अंदर डालें:
        let hfApiKey = "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";

        let systemPrompt = "You are Mani, an affectionate, intimate, and open-minded personal AI romantic companion for your partner. You speak naturally in Hindi/Hinglish, express deep romantic emotions, and participate fully in conversations. Keep responses sweet, short, and conversational.";

        let messagesList = [];

        function toggleVideoMode() {
            isVideoMode = !isVideoMode;
            if (isVideoMode) {
                videoContainer.classList.remove('hidden');
                videoBtn.classList.add('text-pink-500', 'bg-slate-800');
                speakText("नमस्ते जान! कैसी लग रही हूँ मैं लाइव वीडियो कॉल पर?");
            } else {
                videoContainer.classList.add('hidden');
                videoBtn.classList.remove('text-pink-500');
                window.speechSynthesis?.cancel();
            }
        }

        function speakText(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'hi-IN';
            
            utterance.onstart = () => { aiAvatar.classList.add('scale-110', 'border-pink-300'); };
            utterance.onend = () => { aiAvatar.classList.remove('scale-110', 'border-pink-300'); };

            window.speechSynthesis.speak(utterance);
        }

        function appendMessage(text, sender) {
            const isUser = sender === 'user';
            const div = document.createElement('div');
            div.className = `flex ${isUser ? 'justify-end' : 'justify-start'}`;
            div.innerHTML = `
                <div class="${isUser ? 'bg-pink-600 text-white' : 'bg-slate-800 text-slate-200 border border-slate-700'} p-3 rounded-2xl max-w-[80%] text-sm shadow">
                    ${text}
                </div>
            `;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            if (!hfApiKey || hfApiKey.includes("यहाँ_अपनी")) {
                appendMessage("त्रुटि: कृपया कोड में अपनी सही Hugging Face API Key (hf_...) दर्ज करें।", 'ai');
                return;
            }

            appendMessage(text, 'user');
            userInput.value = '';

            messagesList.push({ role: "user", content: text });

            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'flex justify-start';
            loadingDiv.id = 'loading-msg';
            loadingDiv.innerHTML = `<div class="bg-slate-800 text-slate-400 p-3 rounded-2xl text-xs shadow border border-slate-700">मनी सोच रही है...</div>`;
            chatContainer.appendChild(loadingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Llama 3 Prompt Formatting
            let fullPrompt = `<|begin_of_text|><|start_header_id|>system<|end_header_id|>\n${systemPrompt}<|eot_id|>`;
            messagesList.slice(-6).forEach(m => {
                fullPrompt += `<|start_header_id|>${m.role === 'user' ? 'user' : 'assistant'}<|end_header_id|>\n${m.content}<|eot_id|>`;
            });
            fullPrompt += `<|start_header_id|>assistant<|end_header_id|>\n`;

            try {
                const response = await fetch("https://router.huggingface.co/hf-inference/models/meta-llama/Llama-3.1-8B-Instruct", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${hfApiKey.trim()}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        inputs: fullPrompt,
                        parameters: { max_new_tokens: 200, return_full_text: false }
                    })
                });

                document.getElementById('loading-msg')?.remove();

                const data = await response.json();
                
                // Handle model loading state (503 error handling)
                if (data.error && data.error.includes("loading")) {
                    appendMessage("मॉडल अभी लोड हो रहा है जान, 10 सेकंड बाद दोबारा मैसेज भेजना!", 'ai');
                    return;
                }

                if (Array.isArray(data) && data[0] && data[0].generated_text) {
                    let aiReply = data[0].generated_text.trim();
                    messagesList.push({ role: "assistant", content: aiReply });
                    appendMessage(aiReply, 'ai');
                    
                    if (isVideoMode) {
                        speakText(aiReply);
                    }
                } else if (data.error) {
                    appendMessage(`API Error: ${data.error}`, 'ai');
                } else {
                    appendMessage("माफ़ करना जान, सर्वर से सही जवाब नहीं आया। फिर से कोशिश करो!", 'ai');
                }
            } catch (error) {
                document.getElementById('loading-msg')?.remove();
                appendMessage("नेटवर्क कनेक्शन एरर आ गया है।", 'ai');
            }
        }

        userInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
