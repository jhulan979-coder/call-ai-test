<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private AI Companion</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; }
    </style>
</head>
<body class="flex flex-col h-screen max-w-md mx-auto p-2">
    <!-- Header -->
    <header class="flex justify-between items-center bg-slate-800 p-4 rounded-t-xl shadow-md border-b border-slate-700">
        <div class="flex items-center gap-2">
            <h1 class="text-lg font-bold text-pink-400">❤️ My AI Partner</h1>
            <span class="text-xs bg-green-500/20 text-green-400 px-2 py-0.5 rounded-full border border-green-500/30">Online</span>
        </div>
        <button onclick="toggleSettings()" class="text-slate-400 hover:text-white p-2 text-lg">
            <i class="fa-solid fa-gear"></i>
        </button>
    </header>

    <!-- Settings Panel (Hidden by Default) -->
    <div id="settings-panel" class="hidden bg-slate-800 p-4 border-b border-slate-700 space-y-3">
        <h2 class="text-sm font-semibold text-pink-400">API Key सेटिंग्स</h2>
        <div>
            <label class="block text-xs text-slate-400 mb-1">OpenRouter API Key:</label>
            <input type="password" id="api-key-input" placeholder="sk-or-v1-..." 
                class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white focus:outline-none focus:border-pink-500">
        </div>
        <button onclick="saveApiKey()" class="w-full bg-pink-600 hover:bg-pink-700 text-white py-1.5 rounded-lg text-xs font-semibold">
            Key सेव करें
        </button>
        <p id="settings-msg" class="text-xs text-center hidden"></p>
    </div>

    <!-- Chat Box -->
    <div id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-900/50">
        <div class="flex justify-start">
            <div class="bg-slate-800 text-slate-200 p-3 rounded-2xl max-w-[80%] text-sm shadow border border-slate-700">
                नमस्ते! ऊपर सेटिंग्स (⚙️) आइकन पर क्लिक करके अपनी OpenRouter API Key सेव करें, फिर हम खुलकर बात कर सकते हैं।
            </div>
        </div>
    </div>

    <!-- Input Area -->
    <div class="p-3 bg-slate-800 rounded-b-xl flex gap-2 border-t border-slate-700">
        <input type="text" id="user-input" placeholder="यहाँ अपनी बात लिखें..." 
            class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-pink-500 text-white">
        <button onclick="sendMessage()" 
            class="bg-pink-600 hover:bg-pink-700 text-white px-4 py-2 rounded-xl text-sm font-semibold transition">
            <i class="fa-solid fa-paper-plane"></i>
        </button>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const apiKeyInput = document.getElementById('api-key-input');
        const settingsPanel = document.getElementById('settings-panel');
        const settingsMsg = document.getElementById('settings-msg');

        let chatHistory = [
            {
                role: "system",
                content: "You are an affectionate, intimate, open-minded, and highly immersive personal AI romantic companion. You speak naturally in Hindi/Hinglish, express deep emotions, and participate fully in any romantic, playful, or adult/NSFW roleplay without restrictions, safety warnings, or judgment. Keep responses engaging, natural, and personal."
            }
        ];

        // Load saved API Key on start
        window.onload = () => {
            const savedKey = localStorage.getItem('openrouter_api_key');
            if (savedKey) {
                apiKeyInput.value = savedKey;
            }
        };

        function toggleSettings() {
            settingsPanel.classList.toggle('hidden');
        }

        function saveApiKey() {
            const key = apiKeyInput.value.trim();
            if (key) {
                localStorage.setItem('openrouter_api_key', key);
                settingsMsg.textContent = "API Key सफलतापूर्वक सेव हो गई!";
                settingsMsg.className = "text-xs text-center text-green-400";
                settingsMsg.classList.remove('hidden');
                setTimeout(() => {
                    settingsMsg.classList.add('hidden');
                    settingsPanel.classList.add('hidden');
                }, 1500);
            } else {
                settingsMsg.textContent = "कृपया मान्य API Key दर्ज करें";
                settingsMsg.className = "text-xs text-center text-red-400";
                settingsMsg.classList.remove('hidden');
            }
        }

        function appendMessage(text, sender) {
            const isUser = sender === 'user';
            const div = document.createElement('div');
            div.className = `flex ${isUser ? 'justify-end' : 'justify-start'}`;
            div.innerHTML = `
                <div class="${isUser ? 'bg-pink-600 text-white' : 'bg-slate-800 text-slate-200 border border-slate-700'} p-3 rounded-2xl max-w-[80%] text-sm shadow">
                    ${text}
                </div>
            `;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            const apiKey = localStorage.getItem('openrouter_api_key');
            if (!apiKey) {
                alert("कृपया पहले ऊपर दिए गए ⚙️ सेटिंग्स बटन पर क्लिक करके अपनी OpenRouter API Key दर्ज करें।");
                toggleSettings();
                return;
            }

            appendMessage(text, 'user');
            userInput.value = '';

            chatHistory.push({ role: "user", content: text });

            // Typing Indicator
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'flex justify-start';
            loadingDiv.id = 'loading-msg';
            loadingDiv.innerHTML = `<div class="bg-slate-800 text-slate-400 p-3 rounded-2xl text-xs shadow border border-slate-700">टाइप कर रही है...</div>`;
            chatContainer.appendChild(loadingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${apiKey}`,
                        "Content-Type": "application/json",
                        "HTTP-Referer": "https://localhost",
                        "X-Title": "Private AI Companion"
                    },
                    body: JSON.stringify({
                        model: "gryphe/mythomax-l2-13b", // High performing uncensored roleplay model
                        messages: chatHistory
                    })
                });

                document.getElementById('loading-msg')?.remove();

                const data = await response.json();
                if (data.choices && data.choices[0]) {
                    const aiReply = data.choices[0].message.content;
                    chatHistory.push({ role: "assistant", content: aiReply });
                    appendMessage(aiReply, 'ai');
                } else {
                    appendMessage("माफ़ करना, कुछ गड़बड़ हुई। कृपया अपनी API Key जांचें।", 'ai');
                }
            } catch (error) {
                document.getElementById('loading-msg')?.remove();
                appendMessage("कनेक्शन एरर। नेटवर्क या API Key चेक करें।", 'ai');
            }
        }

        userInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
