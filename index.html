
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Ludo Game</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:white;font-family:Arial,sans-serif;text-align:center;padding:16px}
h1{color:#ffd54a;margin:8px}
p{color:#cbd5e1}
.board{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);width:min(92vw,420px);aspect-ratio:1;margin:20px auto;background:white;border:4px solid white;gap:2px}
.home{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8px;padding:12px;place-items:center}
.red{background:#ef4444}.green{background:#22c55e}.yellow{background:#facc15}.blue{background:#3b82f6}
.spot{width:75%;height:75%;background:white;border-radius:8px;display:grid;grid-template-columns:1fr 1fr;place-items:center;gap:4px;padding:6px}
.token{width:70%;aspect-ratio:1;border-radius:50%;border:3px solid #ddd;box-shadow:0 2px 4px #555}
.center{background:#e5e7eb;color:#111;display:grid;place-items:center;font-size:clamp(16px,5vw,26px);font-weight:bold}
.track{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:2px;background:#e5e7eb}
.track div{background:white}
.controls{max-width:420px;margin:auto}
button{border:0;border-radius:12px;padding:14px 20px;font-size:17px;font-weight:bold;cursor:pointer}
#roll{background:#ffd54a;color:#111;width:100%;margin:8px 0}
#dice{font-size:44px;margin:8px}
.players{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.player{padding:10px;border-radius:10px;background:#263449}
#status{color:#ffd54a;font-weight:bold;min-height:24px}
</style>
</head>
<body>
<h1>🎲 MY LUDO GAME</h1>
<p>Ek phone par 2–4 players khelo!</p>

<div class="board">
  <div class="home red"><div class="spot"><i class="token"></i><i class="token"></i><i class="token"></i><i class="token"></i></div></div>
  <div class="track" id="top"></div>
  <div class="home green"><div class="spot"><i class="token"></i><i class="token"></i><i class="token"></i><i class="token"></i></div></div>
  <div class="track" id="left"></div>
  <div class="center">🏁<br> LUDO</div>
  <div class="track" id="right"></div>
  <div class="home yellow"><div class="spot"><i class="token"></i><i class="token"></i><i class="token"></i><i class="token"></i></div></div>
  <div class="track" id="bottom"></div>
  <div class="home blue"><div class="spot"><i class="token"></i><i class="token"></i><i class="token"></i><i class="token"></i></div></div>
</div>

<div class="controls">
  <div id="dice">🎲</div>
  <div id="status">Red ki baari!</div>
  <button id="roll" onclick="rollDice()">🎲 Dice Roll Karo</button>
  <div class="players">
    <div class="player">🔴 Red: <span id="s0">0</span></div>
    <div class="player">🟢 Green: <span id="s1">0</span></div>
    <div class="player">🟡 Yellow: <span id="s2">0</span></div>
    <div class="player">🔵 Blue: <span id="s3">0</span></div>
  </div>
  <button onclick="resetGame()">🔄 New Game</button>
</div>

<script>
const colors=["Red","Green","Yellow","Blue"];
const diceFaces=["⚀","⚁","⚂","⚃","⚄","⚅"];
let turn=0, scores=[0,0,0,0], busy=false;

document.querySelectorAll(".track").forEach(track=>{
  for(let i=0;i<9;i++){
    const cell=document.createElement("div");
    track.appendChild(cell);
  }
});

function rollDice(){
  if(busy)return;
  busy=true;
  const n=Math.floor(Math.random()*6)+1;
  document.getElementById("dice").textContent=diceFaces[n-1];
  document.getElementById("status").textContent=colors[turn]+" ne "+n+" nikala!";
  if(n===6){
    scores[turn]++;
    document.getElementById("s"+turn).textContent=scores[turn];
  }
  setTimeout(()=>{
    if(n!==6)turn=(turn+1)%4;
    document.getElementById("status").textContent=
      colors[turn]+" ki baari!";
    busy=false;
  },700);
}

function resetGame(){
  turn=0;scores=[0,0,0,0];busy=false;
  document.getElementById("dice").textContent="🎲";
  scores.forEach((s,i)=>document.getElementById("s"+i).textContent=s);
  document.getElementById("status").textContent="Red ki baari!";
}
</script>
</body>
</html>
