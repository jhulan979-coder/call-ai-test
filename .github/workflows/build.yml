name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build APK with Cordova
        run: |
          # NPM fetch retries बढ़ाना ताकि नेटवर्क डिस्कनेक्ट न हो
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          
          npm install -g cordova --no-audit
          cordova create cordova_project com.privateai.app "MyAICompanion"
          
          # index.html फाइलों को Cordova www फोल्डर में कॉपी करना
          cp index.html cordova_project/www/ || true
          
          cd cordova_project
          cordova platform add android
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrivateAI-Companion-APK
          path: cordova_project/platforms/android/app/build/outputs/apk/debug/app-debug.apk
