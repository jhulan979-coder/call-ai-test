name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize Cordova Project & Build APK
        run: |
          npm install -g cordova
          cordova create cordova_project com.privateai.app "MyAICompanion"
          
          # HTML/JS फाइलों को Cordova के www फोल्डर में कॉपी करना
          cp index.html cordova_project/www/ || true
          
          cd cordova_project
          cordova platform add android
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrivateAI-Companion-APK
          path: cordova_project/platforms/android/app/build/outputs/apk/debug/app-debug.apk
